# Single-VM demo deployment of the API + worker, co-hosted with other apps.
# Layout on the VM:
#   /opt/therapyos/docker-compose.yml   (this file)
#   /opt/therapyos/.env                 (secrets; see infrastructure/scripts/vm-deploy.sh)
#   /opt/therapyos/src/                 (repository checkout)
# Uses the `migrate` build stage (full dependencies) so NODE_ENV=development works
# (pino-pretty, on-screen OTP, mock payments) and prisma/seed are available.
name: therapyos

x-api: &api
  image: therapyos-api-full:current
  env_file: .env
  restart: unless-stopped
  volumes:
    - uploads:/repo/apps/api/uploads
  networks: [therapyos]

services:
  postgres:
    image: postgres:17-alpine
    container_name: therapyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: therapyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: therapyos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U therapyos -d therapyos']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [therapyos]

  redis:
    image: redis:7-alpine
    container_name: therapyos-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [therapyos]

  migrate:
    <<: *api
    build:
      context: ./src
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrate
    container_name: therapyos-migrate
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api
    container_name: therapyos-api
    command: ['node', 'dist/main.js']
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4100}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health/live || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *api
    container_name: therapyos-worker
    command: ['node', 'dist/worker.js']
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  therapyos:
    name: therapyos
